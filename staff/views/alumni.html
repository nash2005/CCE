<!doctype html>
<html>
<head>
  <title>Alumni Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/theme.css">
</head>
<body>

<div id="sidebar-container"></div>

<div class="content" style="margin-left:0;margin-top:88px;">
  <div class="topbar d-flex justify-content-between align-items-center">
    <h5>Alumni Management</h5>
    <span>Welcome, Staff</span>
  </div>

  <!-- Search and Filter Section -->
  <div class="search-section">
    <div class="row g-3">
      <div class="col-md-5">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fas fa-search"></i></span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search by name, ID, course...">
        </div>
      </div>
      <div class="col-md-4">
        <select class="form-select" id="courseFilter">
          <option value="">All Courses</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" onclick="applyFilters()">
          <i class="fas fa-search"></i> Search
        </button>
      </div>
    </div>
  </div>

  <!-- Alumni Table -->
  <div class="table-container">
    <h5 class="mb-3"><i class="fas fa-user-tie me-2"></i>Alumni List</h5>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Student Number</th>
            <th>Full Name</th>
            <th>Course</th>
            <th>Graduation Year</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="alumniTableBody">
          <!-- Data will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/REQUEST/shared/js/csrf.js"></script>
<script src="/REQUEST/shared/js/auth.js"></script>
<script src="/REQUEST/shared/js/escape.js"></script>
<script>
// Load sidebar
fetch('sidebar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
    });

// Load courses for filter
async function loadCourses() {
    try {
        const response = await axios.get('../api/get_courses.php');
        if (response.data.success) {
            const courses = response.data.data;
            const select = document.getElementById('courseFilter');
            courses.forEach(course => {
                select.innerHTML += `<option value="${escapeHtml(course.course_id)}">${escapeHtml(course.course_name)}</option>`;
            });
        }
    } catch (error) {
        console.error('Error loading courses:', error);
    }
}

// Load alumni
async function loadAlumni() {
    const search = document.getElementById('searchInput').value;
    const course = document.getElementById('courseFilter').value;
    
    try {
        const response = await axios.get('../api/get_alumni.php', {
            params: { search, course }
        });
        
        if (response.data.success) {
            displayAlumni(response.data.data);
        }
    } catch (error) {
        console.error('Error loading alumni:', error);
        document.getElementById('alumniTableBody').innerHTML = `
            <tr><td colspan="6" class="text-center text-danger">Error loading alumni</td></tr>
        `;
    }
}

// Display alumni
function displayAlumni(alumni) {
    const tbody = document.getElementById('alumniTableBody');
    
    if (!alumni || alumni.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center">No alumni found</td></tr>`;
        return;
    }
    
    tbody.innerHTML = '';
    alumni.forEach(person => {
        tbody.innerHTML += `
            <tr>
                <td>${escapeHtml(person.student_number || 'N/A')}</td>
                <td>${escapeHtml(person.first_name || '')} ${escapeHtml(person.last_name || '')}</td>
                <td>${escapeHtml(person.course_name || 'N/A')}</td>
                <td>${escapeHtml(person.graduation_year || 'N/A')}</td>
                <td>${escapeHtml(person.email || 'N/A')}</td>
                <td><span class="status-badge status-active">Alumni</span></td>
            </tr>
        `;
    });
}

// Apply filters
function applyFilters() {
    loadAlumni();
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    loadCourses();
    loadAlumni();
});

// Real-time search
let timeout;
document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(timeout);
    timeout = setTimeout(loadAlumni, 500);
});

document.getElementById('courseFilter').addEventListener('change', loadAlumni);
</script>

</body>
</html>
