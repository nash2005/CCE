<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Component</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-brand">
        <img src="../../images/1.png" alt="CCES" style="width:32px;height:32px;max-width:32px;max-height:32px;object-fit:contain;">
        <span>CCES Online Requisition</span>
      </div>
      <div style="flex:1;"></div>
      <div class="topbar-right" style="display:flex;align-items:center;gap:0.75rem;">
        <div class="notification-wrapper" style="position:relative;">
          <button id="notifBell" class="btn btn-link p-0 position-relative" style="color:#64748b;font-size:1.15rem;text-decoration:none;" title="Notifications">
            <i class="fas fa-bell"></i>
            <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.6rem;display:none;">0</span>
          </button>
          <div id="notifDropdown" class="notif-dropdown">
            <div class="notif-header">
              <span><i class="fas fa-bell" style="color:#667eea;"></i> Notifications</span>
              <span id="notifAge" style="font-weight:400;font-size:0.7rem;color:#94a3b8;">Last 15 days</span>
            </div>
            <div id="notifList" class="notif-list">
              <div class="notif-empty">No notifications</div>
            </div>
          </div>
          <style>
            .notif-dropdown{display:none;position:absolute;right:0;top:calc(100% + 8px);width:340px;max-height:420px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.12);z-index:2000;padding:0;overflow:hidden;flex-direction:column;}
            .notif-dropdown.open{display:flex;}
            .notif-header{padding:0.75rem 1rem;border-bottom:1px solid #e2e8f0;font-weight:700;font-size:0.85rem;color:#1e293b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
            .notif-list{padding:0.25rem 0;overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch;}
            .notif-empty{text-align:center;padding:1.5rem;color:#94a3b8;font-size:0.82rem;}
            .notif-item{padding:0.6rem 1rem;border-bottom:1px solid #f1f5f9;transition:background 0.15s;}
            .notif-item:last-child{border-bottom:none;}
            .notif-item:hover{background:#f8fafc;}
            .notif-item-inner{display:flex;align-items:flex-start;gap:0.6rem;}
            .notif-icon{margin-top:3px;font-size:0.85rem;flex-shrink:0;}
            .notif-body{flex:1;min-width:0;}
            .notif-title{font-size:0.78rem;font-weight:600;color:#1e293b;}
            .notif-msg{font-size:0.75rem;color:#64748b;margin-top:1px;word-wrap:break-word;}
            .notif-meta{font-size:0.68rem;color:#94a3b8;margin-top:2px;display:flex;justify-content:space-between;}
            @media(max-width:576px){
              .notif-dropdown{position:fixed;left:0.5rem;right:0.5rem;top:var(--cces-topbar-height,48px);width:auto;max-height:calc(100vh - var(--cces-topbar-height,48px) - 0.5rem);border-radius:0 0 12px 12px;box-shadow:0 8px 30px rgba(0,0,0,0.18);}
              .notif-header{padding:0.7rem 1rem;font-size:0.8rem;}
              .notif-item{padding:0.55rem 1rem;}
              .notif-title{font-size:0.75rem;}
              .notif-msg{font-size:0.72rem;}
              .notif-meta{font-size:0.65rem;}
            }
          </style>
        </div>
        <span class="role-label">Program</span>
        <span class="role-value" id="topbarProgram">Student</span>
        <a href="#" id="logoutBtnTopbar" class="topbar-logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </div>

    <nav class="student-navbar">
      <div class="student-navbar-inner">
        <div class="navbar-dropdown">
          <a href="#" class="navbar-link">Student Management <i class="fas fa-caret-down"></i></a>
          <div class="navbar-dropdown-menu">
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="student_profile.html"><i class="fas fa-user"></i> Student Profile</a>
          </div>
        </div>
        <div class="navbar-dropdown">
          <a href="#" class="navbar-link">Document Requests <i class="fas fa-caret-down"></i></a>
          <div class="navbar-dropdown-menu">
            <a href="requests.html"><i class="fas fa-clipboard-list"></i> My Requests</a>
            <a href="archived_requests.html"><i class="fas fa-archive"></i> Archived Requests</a>
          </div>
        </div>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
