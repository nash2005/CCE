<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Online Requisition - Forgot Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../login/style/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-left">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>

        <img src="../../images/1.png" class="logo" />

        <div class="animated-block">
          <h3>CITY COLLEGE OF EL SALVADOR</h3>
          <p>School Online Requisition</p>
        </div>
      </div>

      <div class="login-right">
        <div class="login-header">
          <h2>Forgot Password</h2>
          <p class="text-muted">
            Enter your registered email to receive a password reset link
          </p>
        </div>

        <div id="errorMessage" class="alert alert-danger" style="display: none">
          <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
        </div>

        <form id="forgotPasswordForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your registered email"
              required
            />
          </div>

          <div class="mb-3 captcha-row">
            <span id="captchaQuestion" class="captcha-question"></span>

            <input
              type="text"
              class="form-control captcha-mini"
              id="captchaInput"
              placeholder="?"
              inputmode="numeric"
              pattern="\d*"
            />

            <input type="hidden" id="captchaAnswer" />
          </div>

          <button type="submit" class="btn btn-login w-100">
            <i class="fas fa-paper-plane"></i> Send Reset Link
          </button>

          <div class="text-center mt-3">
            <a href="login.html" class="forgot-password-link">
              <i class="fas fa-arrow-left"></i> Back to Login
            </a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../login/script/forgot_password.js"></script>
  </body>
</html>
