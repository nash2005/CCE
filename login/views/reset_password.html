<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Online Requisition - Reset Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../login/style/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-left">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>

        <img src="../../images/1.png" class="logo" />

        <div class="animated-block">
          <h3>CITY COLLEGE OF EL SALVADOR</h3>
          <p>School Online Requisition</p>
        </div>
      </div>

      <div class="login-right">
        <div class="login-header">
          <h2>Reset Password</h2>
          <p class="text-muted">Enter your new password</p>
        </div>

        <div id="errorMessage" class="alert alert-danger" style="display: none">
          <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
        </div>

        <form id="resetPasswordForm">
          <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter new password"
                required
                style="margin-bottom:0;border-right:none;"
              />
              <button
                type="button"
                class="btn btn-outline-secondary toggle-password"
                data-target="password"
                tabindex="-1"
                style="border:2px solid #b0bdd0;border-left:none;border-radius:0 8px 8px 0;background:#eef2f7;"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="password-requirements mt-2">
              <small id="reqLength" class="req-item"><i class="fas fa-circle"></i> At least 8 characters</small>
              <small id="reqUpper" class="req-item"><i class="fas fa-circle"></i> At least 1 uppercase letter</small>
              <small id="reqSpecial" class="req-item"><i class="fas fa-circle"></i> At least 1 special character</small>
            </div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirm_password"
                placeholder="Confirm new password"
                required
                style="margin-bottom:0;border-right:none;"
              />
              <button
                type="button"
                class="btn btn-outline-secondary toggle-password"
                data-target="confirmPassword"
                tabindex="-1"
                style="border:2px solid #b0bdd0;border-left:none;border-radius:0 8px 8px 0;background:#eef2f7;"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-login w-100">
            <i class="fas fa-key"></i> Reset Password
          </button>

          <div class="text-center mt-3">
            <a href="login.html" class="forgot-password-link">
              <i class="fas fa-arrow-left"></i> Back to Login
            </a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../login/script/reset_password.js"></script>
  </body>
</html>
