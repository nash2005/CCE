<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCES Online Requisition - Request Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../login/style/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-left">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
        <div class="shape shape4"></div>

        <img src="../../images/1.png" class="logo" />

        <div class="animated-block">
          <h3>CITY COLLEGE OF EL SALVADOR</h3>
          <p>School Online Requisition</p>
        </div>
      </div>

      <div class="login-right">
        <div class="login-header">
          <h2>Request Registration</h2>
          <p class="text-muted">
            Fill in your details to request a student account
          </p>
        </div>

        <div id="errorMessage" class="alert alert-danger" style="display: none">
          <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
        </div>

        <form id="registrationForm">
          <div class="mb-3">
            <label for="studentNumber" class="form-label">Student ID</label>
            <input
              type="text"
              class="form-control"
              id="studentNumber"
              name="student_number"
              placeholder="e.g. 02-2122-033234"
              required
            />
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                id="lastName"
                name="last_name"
                placeholder="Enter last name"
                required
              />
            </div>
            <div class="col-6">
              <label for="firstName" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                id="firstName"
                name="first_name"
                placeholder="Enter first name"
                required
              />
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="yearLevel" class="form-label">Year Level</label>
              <select class="form-select" id="yearLevel" name="year_level" required
                style="padding: 12px 15px; border-radius: 8px; border: 2px solid #b0bdd0; font-size: 1rem; background-color: #eef2f7; color: #1a1a2e;">
                <option value="" disabled selected>Select year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
            <div class="col-6">
              <label for="courseId" class="form-label">Course</label>
              <select class="form-select" id="courseId" name="course_id" required
                style="padding: 12px 15px; border-radius: 8px; border: 2px solid #b0bdd0; font-size: 1rem; background-color: #eef2f7; color: #1a1a2e;">
                <option value="" disabled selected>Loading courses...</option>
              </select>
            </div>
          </div>

          <div class="mb-3 captcha-row">
            <span id="captchaQuestion" class="captcha-question"></span>
            <input
              type="text"
              class="form-control captcha-mini"
              id="captchaInput"
              placeholder="?"
              inputmode="numeric"
              pattern="\d*"
            />
            <input type="hidden" id="captchaAnswer" />
          </div>

          <button type="submit" class="btn btn-login w-100" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Submit Registration Request
          </button>

          <div class="text-center mt-3">
            <a href="login.html" class="forgot-password-link">
              <i class="fas fa-arrow-left"></i> Back to Login
            </a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../login/script/request_registration.js"></script>
  </body>
</html>
