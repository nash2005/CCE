<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Requests - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../shared/css/theme.css" />
    <style>
      .filter-btn.active {
        background: var(--cces-navy, #0a1628);
        color: #fff;
        border-color: var(--cces-navy, #0a1628);
      }
      .stat-box {
        padding: 1rem 1.25rem;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        text-align: center;
      }
      .stat-box .count {
        font-size: 1.75rem;
        font-weight: 700;
      }
      .stat-box .label {
        font-size: 0.8rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .req-table th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #64748b;
        border-bottom: 2px solid #e2e8f0;
      }
      .req-table td {
        vertical-align: middle;
        font-size: 0.9rem;
      }
      .badge-pending { background: #f59e0b; color: #fff; }
      .badge-approved { background: #10b981; color: #fff; }
      .badge-rejected { background: #ef4444; color: #fff; }
      .badge-processing { background: #3b82f6; color: #fff; }
      .doc-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.75rem;
        background: #e0f2fe;
        color: #0369a1;
        margin: 1px 2px;
      }
      .clearance-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .clearance-dot.approved { background: #10b981; }
      .clearance-dot.pending { background: #f59e0b; }
      .clearance-dot.rejected { background: #ef4444; }
      .price-text { color: #1e40af; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="content" style="margin-left:0;margin-top:88px;">
      <div class="topbar">
        <h4 class="mb-0"><i class="fas fa-file-alt me-2"></i>Manage Requests</h4>
      </div>

      <!-- Stats Row -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="stat-box">
            <div class="count" id="statTotal">0</div>
            <div class="label">Total Requests</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-box">
            <div class="count text-warning" id="statPending">0</div>
            <div class="label">Pending</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-box">
            <div class="count text-success" id="statApproved">0</div>
            <div class="label">Approved</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-box">
            <div class="count text-danger" id="statRejected">0</div>
            <div class="label">Rejected</div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <button class="btn btn-outline-dark btn-sm filter-btn active" data-status="all">All</button>
        <button class="btn btn-outline-warning btn-sm filter-btn" data-status="pending">Pending</button>
        <button class="btn btn-outline-success btn-sm filter-btn" data-status="approved">Approved</button>
        <button class="btn btn-outline-danger btn-sm filter-btn" data-status="rejected">Rejected</button>
        <div class="ms-auto">
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search student..." style="width:220px;">
        </div>
      </div>

      <!-- Table -->
      <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table req-table mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th>Student</th>
              <th>Course/Year</th>
              <th>Documents</th>
              <th>Price</th>
              <th>Clearance</th>
              <th>Status</th>
              <th>Date Requested</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="8" class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted mb-0">Loading requests...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="fas fa-file-alt me-2"></i>Request Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="detailBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="/REQUEST/shared/js/auth.js"></script>
    <script src="../script/manage_requests.js"></script>
  </body>
</html>
