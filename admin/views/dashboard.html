<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Shared Theme -->
    <link rel="stylesheet" href="../../shared/css/theme.css" />
  </head>
  <body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="content" style="margin-left:0;margin-top:88px;">
      <div class="topbar d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Dashboard Overview</h5>
        <span class="text-muted">Welcome, Admin</span>
      </div>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="stat-card bg-student">
            <h6>Total Students</h6>
            <h2 id="totalStudents">120</h2>
            <i class="fas fa-user-graduate fa-2x"></i>
          </div>
        </div>

        <div class="col-md-4">
          <div class="stat-card bg-alumni">
            <h6>Total Alumni</h6>
            <h2 id="totalAlumni">80</h2>
            <i class="fas fa-user fa-2x"></i>
          </div>
        </div>

        <div class="col-md-4">
          <div class="stat-card bg-staff">
            <h6>Total Staff</h6>
            <h2 id="totalStaff">5</h2>
            <i class="fas fa-user-tie fa-2x"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/REQUEST/shared/js/auth.js"></script>
    <script src="../script/dashboard.js"></script>
  </body>
</html>
