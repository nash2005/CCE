<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archived Students - Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../shared/css/theme.css" />
    <style>
      .sidebar {
        width: 260px;
        height: 100vh;
        background: linear-gradient(180deg, #1e293b, #0f172a);
        color: #fff;
        position: fixed;
        padding-top: 20px;
      }
      .sidebar h4 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: bold;
      }
      .sidebar a {
        color: #cbd5e1;
        text-decoration: none;
        padding: 12px 20px;
        display: block;
        transition: 0.3s;
      }
      .sidebar a:hover {
        background: #1e40af;
        color: #fff;
      }
      .submenu {
        padding-left: 20px;
        display: none;
      }
      .submenu a {
        font-size: 0.9rem;
      }
      .content {
        margin-left: 250px;
        padding: 20px;
        background: #f8f9fa;
        min-height: 100vh;
      }
      .loading-spinner {
        display: none;
        text-align: center;
        padding: 20px;
      }
      .loading-spinner.active {
        display: block;
      }
      .empty-state {
        text-align: center;
        padding: 40px 0;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="content" style="margin-left:0;margin-top:88px;">
      <h4>Archived Students</h4>
      <span id="archivedCount" class="text-muted">Loading...</span>

      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-border text-primary"></div>
        <p>Loading archived students...</p>
      </div>

      <div class="table-responsive mt-3">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Student Number</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Course</th>
              <th>Year Level</th>
              <th>Archived At</th>
            </tr>
          </thead>
          <tbody id="archivedTableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/REQUEST/shared/js/csrf.js"></script>
    <script src="/REQUEST/shared/js/auth.js"></script>
    <script src="../../shared/js/escape.js"></script>
    <script src="../script/archived_students.js"></script>
  </body>
</html>
